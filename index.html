<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA Alta Juega - Creador de Juegos, Scripts y Modelos</title>
    <style>
        :root {
            --bg-primary: #0a0c10;
            --bg-secondary: #161b22;
            --accent: #7c3aed;
            --accent-hover: #6d28d9;
            --text-light: #f3f4f6;
            --border: #30363d;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-light);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background-color: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h1 {
            color: var(--accent);
            text-align: center;
            margin-bottom: 5px;
            font-size: 2rem;
        }

        p.subtitle {
            text-align: center;
            color: #8b949e;
            margin-bottom: 25px;
        }

        .config-box {
            background-color: #0d1117;
            border: 1px solid var(--border);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #c9d1d9;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            background-color: #161b22;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-light);
            font-size: 14px;
            box-sizing: border-box;
            margin-bottom: 15px;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .output-box {
            margin-top: 25px;
            background-color: #0d1117;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
        }

        pre {
            background-color: #161b22;
            padding: 15px;
            border-radius: 6px;
            overflow-x: auto;
            color: #58a6ff;
            font-family: 'Courier New', Courier, monospace;
            white-space: pre-wrap;
        }

        .status {
            font-size: 14px;
            color: #8b949e;
            margin-top: 5px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎮 IA Alta Juega</h1>
    <p class="subtitle">Especializada en crear Scripts, Interfaces y Modelos (Lua, Java, HTPLS)</p>

    <div class="config-box">
        <label for="apiKey">🔑 Clave API de OpenAI:</label>
        <input type="password" id="apiKey" placeholder="Pega aquí tu clave sk-proj-..." />
    </div>

    <label for="tipoGeneracion">¿Qué deseas crear?</label>
    <select id="tipoGeneracion">
        <option value="Script Lua (Roblox / LÖVE)">Script en Lua (Roblox / LÖVE)</option>
        <option value="Código Java (Minecraft / Android)">Código en Java (Minecraft / Android)</option>
        <option value="Estructura HTPLS / Web UI">Estructura HTPLS / Web UI</option>
        <option value="Modelo 3D o Estructura por Código">Modelo / Objeto 3D por Código</option>
        <option value="Interfaz de Usuario (UI)">Interfaz de Usuario (UI)</option>
    </select>

    <label for="prompt">Describe lo que quieres que haga la IA:</label>
    <textarea id="prompt" placeholder="Ejemplo: Crea un script de sistema de monedas con tienda en pantalla e interfaz flotante."></textarea>

    <button onclick="generarConIA()">🚀 Generar con IA Alta Juega</button>
    <div id="status" class="status"></div>

    <div class="output-box">
        <h3>📄 Resultado Generado:</h3>
        <pre id="output">Esperando solicitud...</pre>
    </div>
</div>

<script>
async function generarConIA() {
    const apiKey = document.getElementById('apiKey').value.trim();
    const tipo = document.getElementById('tipoGeneracion').value;
    const prompt = document.getElementById('prompt').value.trim();
    const statusDiv = document.getElementById('status');
    const outputPre = document.getElementById('output');

    if (!apiKey) {
        alert('Por favor ingresa tu clave API.');
        return;
    }

    if (!prompt) {
        alert('Escribe qué quieres que cree la IA.');
        return;
    }

    statusDiv.innerText = '⏳ IA Alta Juega está procesando y programando tu solicitud...';
    outputPre.innerText = 'Procesando...';

    const systemPrompt = `Eres "IA Alta Juega", la Inteligencia Artificial definitiva experta en desarrollo de videojuegos.
Especialidades:
- Creación de Scripts limpios y sin lag en Lua, Java y HTPLS.
- Diseño de Interfaces de Usuario (UI) atractivas y funcionales.
- Generación de Modelos 3D y estructuras optimizadas por código.

Instrucciones:
Responde directamente con el código solución completo y funcional solicitado, optimizado para alto rendimiento y listo para usar en proyectos de juegos.`;

    try {
        const response = await fetch('https://api.openai.com/v1/chat/completions', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${apiKey}`
            },
            body: JSON.stringify({
                model: 'gpt-4o',
                messages: [
                    { role: 'system', content: systemPrompt },
                    { role: 'user', content: `Tipo de creación: ${tipo}\nInstrucciones: ${prompt}` }
                ],
                temperature: 0.3
            })
        });

        const data = await response.json();

        if (response.ok) {
            outputPre.innerText = data.choices[0].message.content;
            statusDiv.innerText = '✅ ¡Generación completada con éxito por IA Alta Juega!';
        } else {
            outputPre.innerText = 'Error: ' + JSON.stringify(data, null, 2);
            statusDiv.innerText = '❌ Ocurrió un error en la solicitud.';
        }
    } catch (error) {
        outputPre.innerText = 'Error de conexión: ' + error.message;
        statusDiv.innerText = '❌ Error de red o conexión.';
    }
}
</script>

</body>
</html>
